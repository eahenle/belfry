name: Test and build
on:
  push:
  pull_request:
jobs:
  linux-coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest discover -v -s tests
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test.sh
      - run: ./scripts/build-mac.sh
      - run: codesign --verify --deep --strict build/Signals.app
